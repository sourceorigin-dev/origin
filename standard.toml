# How origin applies the engineering standard; the README of the
# `sourceorigin-standard` crate lists its rules and every key here.

# The libraries of the `origin` and `origin-ci` binaries, whose setup and error
# reports use anyhow.
anyhow-crates = ["origin-ci", "origin-src"]

# CI's check on the minimum supported Rust, which runs no recipe.
cargo-in-ci = ["cargo +\"$MSRV\" check --locked --workspace --all-targets --all-features"]

# The pull request checks of .github/workflows/pr.yml, read at a pull
# request's base. The scopes are those titles use.
[pr-checks]
scopes = [
  "agents", "ancestry", "annotations", "api", "auth", "ci", "cli", "client",
  "conflict", "deps", "design", "e2e", "events", "index", "locks", "objects",
  "oplog", "permissions", "platform", "policy", "queue", "remote", "repo",
  "server", "service", "shared", "skills", "src", "standard", "statements",
  "store", "sync", "targets", "tree", "workspace", "workspaces", "worktree",
  "xtask",
]
approvers = ["PiquelChips"]
# Exceptions are only reported until the open stack, which predates the
# standard, lands.
enforce-lint-exceptions = false

# Each deviation lists the files its findings were in when origin adopted the
# standard; `cargo xtask standard --fix` drops each file once it complies.
[deviations]

[deviations.workspace-lints]
reason = "`clippy::unwrap_used` is unset: its findings are fixed in follow-ups"
paths = ["Cargo.toml"]

[deviations.rust-comments]
reason = "56 files of findings, fixed in follow-ups"
paths = [
    "apps/origin-src/src/targets/mod.rs",
    "apps/origin-src/src/targets/tests.rs",
    "apps/origin-src/src/workspace/annotate.rs",
    "apps/origin-src/src/workspace/land.rs",
    "apps/origin-src/src/workspace/mod.rs",
    "apps/origin-src/src/workspace/ops.rs",
    "apps/origin-src/src/workspace/registry.rs",
    "apps/origin-src/src/worktree/mod.rs",
    "apps/origin-src/src/worktree/tests.rs",
    "apps/origin-src/tests/cli.rs",
    "apps/origin-src/tests/http.rs",
]
