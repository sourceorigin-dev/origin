# How origin applies the engineering standard; the README of the
# `sourceorigin-standard` crate lists its rules and every key here.

# The `origin` binary's library, whose server setup and error reports use anyhow.
anyhow-crates = ["origin-src"]

# CI's check on the minimum supported Rust, which runs no recipe.
cargo-in-ci = ["cargo +\"$MSRV\" check --locked --workspace --all-targets --all-features"]

# Each deviation lists the files its findings were in when origin adopted the
# standard; `cargo xtask standard --fix` drops each file once it complies.
[deviations]
agent-files = { reason = "the shared skills replace CLAUDE.md in a follow-up", paths = ["CLAUDE.md"] }
ci-shape = { reason = "ci.yml gets its merge_group trigger and always() in a follow-up", paths = [".github/workflows/ci.yml"] }
clippy-config = { reason = "clippy.toml gets the test settings in a follow-up", paths = ["clippy.toml"] }
config-comments = { reason = "ci.yml's header comment is shortened in a follow-up", paths = [".github/workflows/ci.yml"] }
cargo-locked = { reason = "the recipes gain --locked in a follow-up", paths = ["justfile"] }
layout = { reason = "the xtask alias gains --locked in a follow-up", paths = [".cargo/config.toml"] }
pr-template = { reason = "the pull request template comes with the pull request checks, in a follow-up", paths = [".github/pull_request_template.md"] }
recipes = { reason = "the missing recipes come in follow-ups", paths = ["justfile"] }
scheduled-audit = { reason = "CI audits weekly from a follow-up", paths = [".github/workflows"] }
skills-synced = "the shared skills are synced in a follow-up"
toolchain = { reason = "the toolchain moves to stable in a follow-up", paths = ["rust-toolchain.toml"] }

[deviations.workspace-lints]
reason = "the required lints are set in a follow-up"
paths = ["Cargo.toml"]

[deviations.inline-tests]
reason = "13 findings: the tests move to files of their own in a follow-up"
paths = [
    "apps/origin-src/src/ancestry.rs",
